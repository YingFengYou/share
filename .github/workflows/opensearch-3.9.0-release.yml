name: Build and release OpenSearch 3.9.0 image

on:
  workflow_dispatch:
  push:
    paths:
      - 'opensearch-3.9.0-knn-smartcn-nori/**'
      - '.github/workflows/opensearch-3.9.0-release.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-publish-release:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.9.0'
      IMAGE: 'ghcr.io/yingfengyou/opensearch'
      TAG: '3.9.0-knn-smartcn-nori'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./opensearch-3.9.0-knn-smartcn-nori
          file: ./opensearch-3.9.0-knn-smartcn-nori/Dockerfile
          build-args: OPENSEARCH_VERSION=${{ env.VERSION }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify plugins
        run: |
          set -eux
          docker run --rm --entrypoint /usr/share/opensearch/bin/opensearch-plugin \
            "${IMAGE}:${TAG}" list | tee plugins.txt
          grep -qx 'opensearch-knn' plugins.txt
          grep -qx 'analysis-smartcn' plugins.txt
          grep -qx 'analysis-nori' plugins.txt

      - name: Push image
        run: docker push "${IMAGE}:${TAG}"

      - name: Export OCI image archive
        run: |
          docker save "${IMAGE}:${TAG}" -o "opensearch-${TAG}.docker.tar"
          sha256sum "opensearch-${TAG}.docker.tar" > "opensearch-${TAG}.docker.tar.sha256"

      - name: Create GitHub Release and upload image archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: opensearch-${{ env.TAG }}
          name: OpenSearch ${{ env.VERSION }} with k-NN, SmartCN and Nori
          generate_release_notes: true
          body: |
            Official OpenSearch ${{ env.VERSION }} base image with the following preinstalled plugins:
            - opensearch-knn
            - analysis-smartcn
            - analysis-nori

            GHCR image: `${{ env.IMAGE }}:${{ env.TAG }}`
          files: |
            opensearch-${{ env.TAG }}.docker.tar
            opensearch-${{ env.TAG }}.docker.tar.sha256
